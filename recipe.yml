name: 'Webships Starter'
description: 'The default Webships site template: a web apps gallery with organizations, served through a documented API. JSON:API from /api with OAuth 2.0 and Swagger UI documentation, and the Drupal core administration theme for the back end and the front end.'
type: 'Site'
# Site template metadata for the Webships installer.
extra:
  webship_installer:
    creator: 'Webship'
    links:
      - text: 'Learn more'
        url: 'https://www.drupal.org/project/webships_starter'
recipes:
  # Webpage first: it installs Node, Display Builder and the editorial
  # workflow, and the front-end pages of this template are webpage nodes
  # rendered through Display Builder.
  - modules/contrib/webpage/recipes/default
  # Tags first: core's standard recipe grants the content editor role
  # permissions on the tags vocabulary, so the vocabulary has to exist.
  - core/recipes/tags_taxonomy
  # The standard Drupal content model, for the editorial roles and the editor.
  - core/recipes/standard
  # Web API: JSON:API from /api, read-only, with OAuth 2.0 and Swagger UI.
  - modules/contrib/webapi/recipes/default
  # The default dashboards, built with Display Builder: Webmaster for site
  # administrators, Editorial for content editors.
  - webdash
install:
  # The Drupal core administration theme, used for the whole site.
  - default_admin
  # The apps gallery is browsed and searched.
  - search
  - views
  - views_ui
  - taxonomy
  - path
  - menu_ui
  - field_ui
  # The apps gallery content model needs these field types.
  - image
  - link
  - file
  - options
  - datetime
  - better_exposed_filters
config:
  strict: false
  actions:
    # Content editors write and publish through the editorial workflow.
    user.role.content_editor:
      grantPermissions:
        - 'use editorial transition archive'
        - 'use editorial transition archived_draft'
        - 'use editorial transition archived_published'
        - 'use editorial transition create_new_draft'
        - 'use editorial transition publish'
        - 'view latest version'
      grantPermissionsForEachNodeType:
        - 'create %bundle content'
        - 'delete %bundle revisions'
        - 'delete own %bundle content'
        - 'edit own %bundle content'
    system.theme:
      simpleConfigUpdate:
        default: default_admin
        admin: default_admin
    node.settings:
      simpleConfigUpdate:
        # Edit and add content in the administration theme.
        use_admin_theme: true
    system.site:
      simpleConfigUpdate:
        slogan: 'A web apps gallery, served through an API'
    user.settings:
      simpleConfigUpdate:
        # An API site does not take public registrations.
        register: admin_only
